<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Rubaiya Tabassum Anisha Rahman!</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:Georgia,"Times New Roman",serif;
  background:radial-gradient(circle at 50% 35%,#4b1d66 0%,#211039 45%,#090615 100%);
  color:#fff;display:flex;align-items:center;justify-content:center;
}
#stars,.confetti,.balloons{position:fixed;inset:0;pointer-events:none}
.star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;animation:twinkle 2s infinite alternate}
@keyframes twinkle{to{opacity:.15;transform:scale(.5)}}
.balloon{position:absolute;width:44px;height:58px;border-radius:50% 50% 45% 45%;
  animation:float 7s ease-in-out infinite;opacity:.88}
.balloon:after{content:"";position:absolute;left:50%;top:57px;width:1px;height:105px;background:#fff8}
@keyframes float{0%,100%{transform:translateY(20px) rotate(-4deg)}50%{transform:translateY(-45px) rotate(5deg)}}
.card{
  width:min(92vw,760px);min-height:520px;padding:46px 28px 34px;
  text-align:center;border:1px solid #ffffff2e;border-radius:30px;
  background:#ffffff12;backdrop-filter:blur(14px);
  box-shadow:0 20px 80px #0008;position:relative;z-index:5;
}
.crown{font-size:48px;animation:bounce 1.8s infinite}
@keyframes bounce{50%{transform:translateY(-9px) rotate(4deg)}}
h1{
  margin:8px 0 12px;font-size:clamp(38px,9vw,76px);line-height:1;
  background:linear-gradient(90deg,#ffd86b,#fff,#ff9ed2,#ffd86b);
  background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 4s linear infinite;
}
@keyframes shine{to{background-position:300% center}}
.name{font-size:clamp(22px,5vw,38px);font-weight:bold;color:#ffd8ed;margin:10px auto 20px;max-width:650px}
.message{font-size:clamp(16px,3.2vw,21px);line-height:1.7;color:#f8eefa;max-width:620px;margin:auto}
.cake{font-size:90px;margin:18px 0 8px;filter:drop-shadow(0 8px 16px #0006);animation:cake 2s ease-in-out infinite}
@keyframes cake{50%{transform:scale(1.06) rotate(-1deg)}}
button{
  margin-top:24px;border:0;border-radius:999px;padding:14px 25px;
  font-size:17px;font-weight:bold;color:#38102d;background:linear-gradient(135deg,#ffd76d,#ff9ed2);
  box-shadow:0 8px 30px #ff9ed255;cursor:pointer;transition:.2s;
}
button:active{transform:scale(.96)}
.hidden{display:none}
#surprise{margin-top:20px;font-size:20px;color:#ffe7f4;animation:appear .7s ease}
@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.confetti-piece{position:absolute;width:9px;height:16px;top:-30px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div id="stars"></div>
<div class="balloons" id="balloons"></div>
<div class="confetti" id="confetti"></div>

<main class="card">
  <div class="crown">👑</div>
  <h1>Happy Birthday!</h1>
  <div class="name">Rubaiya Tabassum Anisha Rahman 💖</div>
  <div class="cake">🎂</div>
  <p class="message">
    To a very special sister — may your birthday be filled with
    happiness, laughter, beautiful memories and all the little things
    that make your heart smile. ✨
  </p>
  <button onclick="surprise()">🎁 Open Your Surprise</button>
  <div id="surprise" class="hidden">
    You deserve a day as wonderful and beautiful as you are. 💕<br>
    Happy Birthday, Anisha! 🎉
  </div>
</main>

<script>
const stars=document.getElementById("stars");
for(let i=0;i<100;i++){
  const s=document.createElement("span");s.className="star";
  s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";
  s.style.animationDelay=(Math.random()*2)+"s";stars.appendChild(s);
}
const colors=["#ff8fc7","#ffd86b","#8fe7ff","#b9a0ff","#ffffff"];
const balloons=document.getElementById("balloons");
for(let i=0;i<14;i++){
  const b=document.createElement("div");b.className="balloon";
  b.style.left=(Math.random()*96)+"%";b.style.top=(Math.random()*70)+"%";
  b.style.background=colors[i%colors.length];
  b.style.animationDelay=(Math.random()*5)+"s";balloons.appendChild(b);
}
function confetti(){
  const box=document.getElementById("confetti");
  for(let i=0;i<120;i++){
    const p=document.createElement("span");p.className="confetti-piece";
    p.style.left=Math.random()*100+"%";p.style.background=colors[i%colors.length];
    p.style.transform=`rotate(${Math.random()*360}deg)`;
    p.style.animationDuration=(2.5+Math.random()*3)+"s";
    p.style.animationDelay=(Math.random()*.8)+"s";
    box.appendChild(p);setTimeout(()=>p.remove(),6000);
  }
}
function surprise(){
  document.getElementById("surprise").classList.remove("hidden");
  confetti();
}
setTimeout(confetti,700);
</script>
</body>
</html>
