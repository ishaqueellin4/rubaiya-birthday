<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday Rabeya</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
    }

    .container {
      width: 90%;
      max-width: 600px;
      padding: 30px 20px;
      animation: fadeIn 2s ease;
    }

    h1 {
      font-size: clamp(38px, 10vw, 70px);
      margin-bottom: 15px;
      text-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }

    p {
      font-size: clamp(18px, 5vw, 25px);
      line-height: 1.6;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    button {
      margin-top: 30px;
      padding: 14px 28px;
      border: none;
      border-radius: 30px;
      background: white;
      color: #e85d75;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    button:active {
      transform: scale(0.95);
    }

    .heart {
      position: fixed;
      bottom: -30px;
      font-size: 25px;
      animation: floatUp linear forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }

      to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    #message {
      display: none;
      margin-top: 25px;
      font-size: 19px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎂 Happy Birthday 🎉</h1>

    <p>
      Happy Birthday, Rabeya! 💖<br>
      Wishing you a beautiful day<br>
      filled with happiness, smiles and love. ✨
    </p>

    <button onclick="showMessage()">
      💌 Open Your Surprise
    </button>

    <div id="message">
      Some people make life a little more beautiful<br>
      just by being a part of it. 🌸<br><br>

      May your every wish come true,<br>
      and may your smile always stay this beautiful. ❤️
    </div>

  </div>

  <script>
    function showMessage() {
      document.getElementById("message").style.display = "block";
    }

    function createHeart() {
      const heart = document.createElement("div");

      heart.className = "heart";

      const hearts = ["❤️", "💖", "💕", "💗", "💓", "🌸", "✨"];
      heart.innerHTML =
        hearts[Math.floor(Math.random() * hearts.length)];

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration =
        (4 + Math.random() * 5) + "s";

      heart.style.fontSize =
        (18 + Math.random() * 25) + "px";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 9000);
    }

    setInterval(createHeart, 500);
  </script>

</body>
</html>
